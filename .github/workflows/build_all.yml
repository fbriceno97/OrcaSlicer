# Windows x64 ONLY for the custom OrcaSlicer fork.
# Do not reinstate macOS, Linux, or Windows ARM64 unless explicitly requested.
# A green compile is NOT evidence of enabled Unlayered features.
name: Custom Orca — Windows x64 build and Unlayered readiness

on:
  push:
    branches:
      - feature/unlayered-wave-nonplanar
      - release/*
    paths:
      - 'src/**'
      - 'tests/**'
      - 'deps/**'
      - 'deps_src/**'
      - 'cmake/**'
      - 'version.inc'
      - '.github/workflows/build_all.yml'
  pull_request:
    branches:
      - main
      - release/*
    paths:
      - 'src/**'
      - 'tests/**'
      - 'deps/**'
      - 'deps_src/**'
      - 'cmake/**'
      - 'version.inc'
      - '.github/workflows/build_all.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  # Push and PR synchronization for the same head validate one revision.
  # Different heads can finish unit tests while the next compiler run starts.
  group: custom-win-x64-${{ github.head_ref || github.ref_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  windows-script-check:
    name: Windows x64 build script tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: 'false'
      - name: Run build script test suite
        shell: powershell
        run: .\scripts\test_build_win.ps1

  windows-x64-clearance-tests:
    name: Windows x64 clearance and section-preview geometry tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure production geometry tests
        run: cmake -S tests/hotend_envelope -B build/hotend-envelope -A x64
      - name: Compile production geometry tests
        run: cmake --build build/hotend-envelope --config Release --parallel 4
      - name: Run clearance regression tests
        run: ctest --test-dir build/hotend-envelope -C Release --no-tests=error --output-on-failure --output-junit hotend-results.xml

  windows-x64:
    name: Windows x64 compiler and installer artifact
    needs: windows-script-check
    # Finish active compilation and retain only the newest queued revision.
    concurrency:
      group: custom-win-x64-compile-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: false
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: windows-latest
      arch: x64
      compiler: clang
      build-deps-only: false
      force-build: false
    secrets: inherit

  windows-x64-tests:
    name: Windows x64 unit tests
    needs: windows-x64
    concurrency:
      group: custom-win-x64-unit-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: false
    uses: ./.github/workflows/unit_tests.yml
    with:
      os: windows-latest
      artifact: ${{ github.sha }}-tests-windows-x64
    secrets: inherit

  unlayered-integration-readiness:
    name: Feature wiring check — must pass before a release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify features are wired to the compiled Windows slicer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $checks = @(
            @{ Label = 'Wave geometry compiled'; File = 'src/libslic3r/CMakeLists.txt'; Pattern = 'WaveOverhangs[/\\]WaveOverhangs\.cpp' },
            @{ Label = 'Wave overhang user setting'; File = 'src/libslic3r/PrintConfig.cpp'; Pattern = 'wave_overhangs' },
            @{ Label = 'Wave perimeter integration'; File = 'src/libslic3r/PerimeterGenerator.cpp'; Pattern = 'WaveOverhangs' },
            @{ Label = 'Cut-plane segmentation core'; File = 'src/libslic3r/CMakeLists.txt'; Pattern = 'CutPlaneSegmentation\.cpp' },
            @{ Label = 'Cut-plane GUI compiled'; File = 'src/slic3r/CMakeLists.txt'; Pattern = 'GLGizmoCutPlanes\.cpp' },
            @{ Label = 'Collision check compiled'; File = 'src/libslic3r/CMakeLists.txt'; Pattern = 'HotendCollisionCheck\.cpp' },
            @{ Label = 'Cut-plane slicing orchestration'; File = 'src/libslic3r/PrintApply.cpp'; Pattern = 'derive_cut_segments\(' },
            @{ Label = 'Section G-code frame scope'; File = 'src/libslic3r/GCode.cpp'; Pattern = 'begin_section_frame\(' },
            @{ Label = 'Section frame binding compiled'; File = 'src/libslic3r/CMakeLists.txt'; Pattern = 'GCode[/\\]SectionFrame\.cpp' },
            @{ Label = 'Collision enforcement at export'; File = 'src/libslic3r/Print.cpp'; Pattern = 'check_hotend_collisions\(' }
          )
          $missing = 0
          foreach ($c in $checks) {
            if ((Test-Path $c.File) -and ((Get-Content -Raw $c.File) -match $c.Pattern)) {
              Write-Host "PASS: $($c.Label)"
            } else {
              Write-Host "::error title=Unlayered not integrated::$($c.Label) missing in $($c.File)"
              $missing++
            }
          }
          if ((Get-Content -Raw 'src/libslic3r/Print.cpp') -match 'unsupported_nonplanar_object\(\*this\)\s*!=\s*nullptr') {
            Write-Host '::error title=Section export remains guarded::Frame binding is insufficient: transitions, support and end-to-end validation must be completed before export is enabled.'
            $missing++
          }
          if ($missing -gt 0) {
            Write-Host "::error::Section integration or export readiness is incomplete."
            exit 1
          }
          Write-Host 'Source wiring present. Real G-code and Bambu printer safety validation still REQUIRED.'

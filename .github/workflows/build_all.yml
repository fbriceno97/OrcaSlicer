# Windows x64 ONLY for the custom OrcaSlicer fork.
# Do not reinstate macOS, Linux, or Windows ARM64 unless explicitly requested.
# A green compile is NOT evidence of enabled Unlayered features.
name: Custom Orca — Windows x64 build and Unlayered readiness

on:
  push:
    branches:
      - feature/unlayered-wave-nonplanar
      - release/*
    paths:
      - 'src/**'
      - 'tests/**'
      - 'deps/**'
      - 'deps_src/**'
      - 'cmake/**'
      - 'version.inc'
      - '.github/workflows/build_all.yml'
  pull_request:
    branches:
      - main
      - release/*
    paths:
      - 'src/**'
      - 'tests/**'
      - 'deps/**'
      - 'deps_src/**'
      - 'cmake/**'
      - 'version.inc'
      - '.github/workflows/build_all.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: custom-win-x64-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-script-check:
    name: Windows x64 build script tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: 'false'
      - name: Run build script test suite
        shell: powershell
        run: .\scripts\test_build_win.ps1

  windows-x64:
    name: Windows x64 compiler and installer artifact
    needs: windows-script-check
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: windows-latest
      arch: x64
      compiler: clang
      build-deps-only: false
      force-build: false
    secrets: inherit

  windows-x64-tests:
    name: Windows x64 unit tests
    needs: windows-x64
    uses: ./.github/workflows/unit_tests.yml
    with:
      os: windows-latest
      artifact: ${{ github.sha }}-tests-windows-x64
    secrets: inherit

  unlayered-integration-readiness:
    name: Feature wiring check — must pass before a release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify features are wired to the compiled Windows slicer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $checks = @(
            @{ Label = 'Wave geometry compiled'; File = 'src/libslic3r/CMakeLists.txt'; Pattern = 'WaveOverhangs[/\\]WaveOverhangs\.cpp' },
            @{ Label = 'Wave overhang user setting'; File = 'src/libslic3r/PrintConfig.cpp'; Pattern = 'wave_overhangs' },
            @{ Label = 'Wave perimeter integration'; File = 'src/libslic3r/PerimeterGenerator.cpp'; Pattern = 'WaveOverhangs' },
            @{ Label = 'Cut-plane segmentation core'; File = 'src/libslic3r/CMakeLists.txt'; Pattern = 'CutPlaneSegmentation\.cpp' },
            @{ Label = 'Cut-plane GUI compiled'; File = 'src/slic3r/CMakeLists.txt'; Pattern = 'GLGizmoCutPlanes\.cpp' },
            @{ Label = 'Collision check compiled'; File = 'src/libslic3r/CMakeLists.txt'; Pattern = 'HotendCollisionCheck\.cpp' }
          )
          $missing = 0
          foreach ($c in $checks) {
            if ((Test-Path $c.File) -and ((Get-Content -Raw $c.File) -match $c.Pattern)) {
              Write-Host "PASS: $($c.Label)"
            } else {
              Write-Host "::error title=Unlayered not integrated::$($c.Label) missing in $($c.File)"
              $missing++
            }
          }
          if ($missing -gt 0) {
            Write-Host "::error::Unlayered source files were staged but are not yet connected to the slicer."
            exit 1
          }
          Write-Host 'Source wiring present. Real G-code and Bambu printer safety validation still REQUIRED.'

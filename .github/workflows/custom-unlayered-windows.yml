name: Unlayered Custom Beta Windows x64
on:
  push:
    branches: [feature/unlayered-base-custom-beta]
  workflow_dispatch:
concurrency:
  group: custom-unlayered-windows-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
jobs:
  windows-x64:
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: windows-latest
      arch: x64
      compiler: clang
      build-deps-only: false
      force-build: false
    secrets: inherit

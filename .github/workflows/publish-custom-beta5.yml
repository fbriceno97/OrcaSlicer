name: Publish tested Custom Beta 5
on:
  push:
    branches: [release/custom-beta5]
    paths: [.github/workflows/publish-custom-beta5.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-custom-beta5
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify and publish exact tested artifacts
        shell: python
        run: |
          import hashlib, json, os, pathlib, shutil, subprocess, zipfile
          repo = os.environ["GH_REPO"]
          sha = "634f6c9a906ad6c023893ebb3e862274535480a0"
          tag = "bambu-connect-win-x64-v0.1.0-beta5"
          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", "repos/"+repo+"/"+path]))
          run = api("actions/runs/39714355349")
          assert run["head_sha"] == sha and run["conclusion"] == "success"
          assets = api("actions/runs/39714355349/artifacts")["artifacts"]
          out = pathlib.Path("release-assets")
          out.mkdir()
          for artifact_id, digest, kind in [
              (12398614256, "1963dfca8cbdcd6d3a3afcdf41b4ed89e2dba40ed0ffbb9de684bff62bfe3fa6", "setup"),
              (12399165965, "476ea46abc4f0d266eb0369ef44d01462a5004917780b93be48d50c85248b714", "portable")
          ]:
              item = next(a for a in assets if a["id"] == artifact_id)
              assert not item["expired"] and item["workflow_run"]["head_sha"] == sha
              archive = pathlib.Path(kind+"-artifact.zip")
              with archive.open("wb") as f:
                  subprocess.run(["gh","api","repos/"+repo+"/actions/artifacts/"+str(artifact_id)+"/zip"], stdout=f, check=True)
              assert hashlib.sha256(archive.read_bytes()).hexdigest() == digest
              with zipfile.ZipFile(archive) as z:
                  members = [n for n in z.namelist() if not n.endswith("/")]
                  print(kind, members[:20])
                  if kind == "setup":
                      matches = [n for n in members if n.lower().endswith(".exe")]
                      assert len(matches) == 1, matches
                      (out/"OrcaSlicer-Custom-Beta5-windows-x64-setup.exe").write_bytes(z.read(matches[0]))
                  else:
                      nested = [n for n in members if n.lower().endswith(".zip")]
                      target = out/"OrcaSlicer-Custom-Beta5-windows-x64-portable.zip"
                      if len(members) == 1 and len(nested) == 1:
                          target.write_bytes(z.read(nested[0]))
                      else:
                          assert any(n.lower().endswith(".exe") for n in members)
                          shutil.copyfile(archive, target)
          sums = "".join(hashlib.sha256(p.read_bytes()).hexdigest()+"  "+p.name+"\n" for p in sorted(out.iterdir()))
          (out/"SHA256SUMS.txt").write_text(sums)
          pathlib.Path("release-notes.md").write_text("Windows x64 only. Publishes the exact installer tested and confirmed working by Felix; application binaries were not rebuilt.\n\n## New in Beta 5\n- Distinct **OrcaSlicer Custom Beta** Windows executable identity and Start Menu shortcut.\n- Separate **Open with** registration for 3MF, STL, OBJ, AMF, STEP and STP.\n- Correct Windows version metadata so the custom application name displays reliably.\n- Keeps the existing custom install location and existing settings/login paths.\n- Retains Beta 4's overlapping-surface painting fix and existing Bambu Connect integration.\n\n## Validation\nWindows x64 compilation, installer creation, installed Windows identity/association verification, and painting/core regression tests passed. The user confirmed the resulting build works.\n\nSource commit: 634f6c9a906ad6c023893ebb3e862274535480a0\nBuild: https://github.com/fbriceno97/OrcaSlicer/actions/runs/39714355349\n\n## Downloads\n- setup.exe: installer with Windows Open with registration.\n- portable.zip: extract to a folder; does not install file associations.\n- SHA256SUMS.txt: SHA-256 checksums.\n\nIf you already installed the tested build from run 39714355349, no reinstall is necessary.\n\nFull painting parity across every model and fresh physical-printer testing are not claimed. The separately reported intermittent slicing access violation is not fixed by this packaging release. Linux, macOS and Windows ARM64 are not covered.")
          subprocess.run(["gh","release","create",tag,"--target",sha,"--title","OrcaSlicer Custom Beta 5 — Windows x64","--notes-file","release-notes.md","--prerelease","--draft"], check=True)
          subprocess.run(["gh","release","upload",tag]+[str(p) for p in sorted(out.iterdir())], check=True)
          rel = api("releases/tags/"+tag)
          assert len(rel["assets"]) == 3
          for p in out.iterdir():
              a = next(a for a in rel["assets"] if a["name"] == p.name)
              assert a["size"] == p.stat().st_size
              assert a["digest"] == "sha256:"+hashlib.sha256(p.read_bytes()).hexdigest()
          subprocess.run(["gh","release","edit",tag,"--draft=false"], check=True)
          
